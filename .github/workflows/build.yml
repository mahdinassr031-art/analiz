name: Build and Auto Create Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed app.py

    - name: Compress Build to ZIP
      shell: powershell
      run: |
        Compress-Archive -Path dist/app/* -DestinationPath GearCostPro-Windows.zip

    - name: Create or Update Release
      uses: softprops/action-gh-release@v1
      with:
        files: GearCostPro-Windows.zip
        tag_name: "v1.0.${{ github.run_number }}"
        name: "GearCost Pro v1.0.${{ github.run_number }}"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
